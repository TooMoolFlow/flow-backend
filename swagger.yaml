        - comment

    AdminWorkerRequestStatus:
      type: object
      properties:
        status:
          type: string
          enum: [rejected, awaiting_assignment]
        complexity:
          type: string
          enum: [simple, medium, complex]
        sla:
          type: string
        category_id:
          type: integer
        rejection_reason:
          type: string
      required:
        - status

    UpdateRequestSchema:
      type: object
      description: Schema for universal PATCH endpoint to update request fields
      properties:
        # Основные поля
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Request title
        description:
          type: string
          description: Request description
        location:
          type: string
          minLength: 1
          maxLength: 255
          description: Request location
        location_detail:
          type: string
          maxLength: 255
          description: Additional location details
        
        # Статус и тип
        status:
          type: string
          enum: [in_progress, execution, completed, rejected, awaiting_assignment, awaiting_sla, assigned]
          description: Request status
        request_type:
          type: string
          enum: [normal, urgent, planned]
          description: Request type
        
        # Связанные сущности
        office_id:
          type: integer
          minimum: 1
          description: Office ID
        plan_id:
          type: integer
          minimum: 1
          description: Plan ID
        category_id:
          type: integer
          minimum: 1
          description: Service category ID
        executor_id:
          type: integer
          minimum: 1
          description: Executor ID
        
        # Дополнительные поля
        complexity:
          type: string
          enum: [simple, medium, complex]
          description: Request complexity level
        sla:
          type: string
          description: Service Level Agreement
        comment:
          type: string
          maxLength: 255
          description: Additional comment
        is_long_term:
          type: boolean
          description: Long-term request flag
        
        # Даты
        planned_date:
          type: string
          format: date-time
          description: Planned completion date
        actual_completion_date:
          type: string
          format: date-time
          description: Actual completion date
        
        # Причина отклонения
        rejection_reason:
          type: string
          description: Reason for rejection (required when status is rejected)
        
        # Специальный код для идентификации типа патча
        patch_code:
          type: integer
          minimum: 1
          description: Special code to identify patch type (1 for department-head notifications, 3 for admin SLA/complexity updates)
    Notification:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        request_id:
          type: integer
        title:
          type: string
        content:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - request_id
        - title
        - content
        - is_read
        - created_at
